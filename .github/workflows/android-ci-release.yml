name: Android CI and Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android

      - name: Restore
        shell: pwsh
        run: dotnet restore SpectraGrab.Android.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build SpectraGrab.Android.csproj -f net8.0-android -c Release --no-restore

      - name: Publish APK
        shell: pwsh
        run: dotnet publish SpectraGrab.Android.csproj -f net8.0-android -c Release --no-restore -p:AndroidPackageFormats=apk -o artifacts/apk

      - name: Publish AAB
        shell: pwsh
        run: dotnet publish SpectraGrab.Android.csproj -f net8.0-android -c Release --no-restore -p:AndroidPackageFormats=aab -o artifacts/aab

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: SpectraGrab-Android-${{ github.sha }}
          path: artifacts/**
          if-no-files-found: error
