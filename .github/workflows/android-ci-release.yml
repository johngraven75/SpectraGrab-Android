name: Android CI, Runtime Verification, and Release

on:
  push:
    branches: [main, agent/complete-capture-and-config]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  DOTNET_VERSION: 10.0.100
  RELEASE_VERSION: 0.2.0
  RELEASE_VERSION_CODE: 2

jobs:
  validate:
    name: Validate and build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate persistent provider and add-in configs
        shell: bash
        run: bash scripts/validate-persistent-configs.sh

      - name: Validate release policy
        shell: bash
        run: bash scripts/validate-android-release.sh

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android --version $env:DOTNET_VERSION

      - name: Restore
        shell: pwsh
        run: dotnet restore SpectraGrab.Android.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build SpectraGrab.Android.csproj -f net10.0-android -c Release --no-restore

  package:
    name: Create production-signed packages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require production signing secrets
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $required = @(
            'ANDROID_KEYSTORE_BASE64',
            'ANDROID_KEYSTORE_PASSWORD',
            'ANDROID_KEY_ALIAS',
            'ANDROID_KEY_PASSWORD'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace((Get-Item "Env:$_" -ErrorAction SilentlyContinue).Value) })
          if ($missing.Count -gt 0) {
            throw "Production Android signing is required. Missing GitHub Actions secrets: $($missing -join ', ')."
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android --version $env:DOTNET_VERSION

      - name: Restore
        shell: pwsh
        run: dotnet restore SpectraGrab.Android.csproj

      - name: Decode and verify production keystore
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP 'spectragrab-production.p12'
          try {
            [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          } catch {
            throw "ANDROID_KEYSTORE_BASE64 is not a valid Base64-encoded keystore: $($_.Exception.Message)"
          }
          $keytoolOutput = & keytool -list -v -keystore $keystorePath -storepass $env:ANDROID_KEYSTORE_PASSWORD -alias $env:ANDROID_KEY_ALIAS 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Production keystore or alias validation failed: $keytoolOutput" }
          if ($keytoolOutput -match 'Android Debug') { throw 'A debug signing certificate cannot be used for production.' }
          $fingerprintLine = $keytoolOutput | Where-Object { $_ -match 'SHA256:' } | Select-Object -First 1
          if (-not $fingerprintLine) { throw 'Unable to read the production signing certificate fingerprint.' }
          $fingerprint = (($fingerprintLine -split 'SHA256:')[1] -replace '[^0-9A-Fa-f]', '').ToLowerInvariant()
          "ANDROID_KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SIGNING_CERT_SHA256=$fingerprint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish production-signed APK and AAB
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $signing = @(
            '-p:AndroidKeyStore=true',
            "-p:AndroidSigningKeyStore=$env:ANDROID_KEYSTORE_PATH",
            "-p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD",
            "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS",
            "-p:AndroidSigningKeyPass=$env:ANDROID_KEY_PASSWORD"
          )
          dotnet publish SpectraGrab.Android.csproj -f net10.0-android -c Release --no-restore -p:AndroidPackageFormats=apk -o artifacts/apk @signing
          if ($LASTEXITCODE -ne 0) { throw 'Production APK publication failed.' }
          dotnet publish SpectraGrab.Android.csproj -f net10.0-android -c Release --no-restore -p:AndroidPackageFormats=aab -o artifacts/aab @signing
          if ($LASTEXITCODE -ne 0) { throw 'Production AAB publication failed.' }

      - name: Build same-key upgrade verification APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $signing = @(
            '-p:AndroidKeyStore=true',
            "-p:AndroidSigningKeyStore=$env:ANDROID_KEYSTORE_PATH",
            "-p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD",
            "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS",
            "-p:AndroidSigningKeyPass=$env:ANDROID_KEY_PASSWORD"
          )
          dotnet publish SpectraGrab.Android.csproj -f net10.0-android -c Release --no-restore -p:AndroidPackageFormats=apk -p:ApplicationVersion=3 -p:ApplicationDisplayVersion=0.2.1-test -o artifacts/upgrade-test @signing
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade verification APK publication failed.' }

      - name: Select and verify release packages
        shell: pwsh
        run: |
          $releaseDirectory = New-Item -ItemType Directory -Force artifacts/release
          $runtimeDirectory = New-Item -ItemType Directory -Force artifacts/runtime
          $apks = @(Get-ChildItem artifacts/apk -Recurse -File -Filter '*-Signed.apk')
          $aabs = @(Get-ChildItem artifacts/aab -Recurse -File -Filter '*-Signed.aab')
          $upgradeApks = @(Get-ChildItem artifacts/upgrade-test -Recurse -File -Filter '*-Signed.apk')
          if ($apks.Count -ne 1) { throw "Expected exactly one production-signed APK, found $($apks.Count)." }
          if ($aabs.Count -ne 1) { throw "Expected exactly one production-signed AAB, found $($aabs.Count)." }
          if ($upgradeApks.Count -ne 1) { throw "Expected exactly one signed upgrade-test APK, found $($upgradeApks.Count)." }

          $releaseApk = Join-Path $releaseDirectory.FullName "SpectraGrab-Android-v$env:RELEASE_VERSION.apk"
          $releaseAab = Join-Path $releaseDirectory.FullName "SpectraGrab-Android-v$env:RELEASE_VERSION.aab"
          $upgradeApk = Join-Path $runtimeDirectory.FullName 'SpectraGrab-Android-upgrade-test.apk'
          Copy-Item $apks[0].FullName $releaseApk
          Copy-Item $aabs[0].FullName $releaseAab
          Copy-Item $upgradeApks[0].FullName $upgradeApk
          Copy-Item $releaseApk (Join-Path $runtimeDirectory.FullName 'SpectraGrab-Android-release.apk')

          $buildTools = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $buildTools) { throw 'Android build-tools were not found.' }
          $apkSigner = Join-Path $buildTools.FullName 'apksigner.bat'
          $aapt = Join-Path $buildTools.FullName 'aapt.exe'
          $signatureReport = & $apkSigner verify --verbose --print-certs $releaseApk 2>&1
          if ($LASTEXITCODE -ne 0) { throw "APK signature verification failed: $signatureReport" }
          if ($signatureReport -match 'Android Debug') { throw 'Release APK is signed with an Android Debug certificate.' }
          $actualFingerprintLine = $signatureReport | Where-Object { $_ -match 'certificate SHA-256 digest:' } | Select-Object -First 1
          if (-not $actualFingerprintLine) { throw 'APK signer certificate fingerprint is missing.' }
          $actualFingerprint = (($actualFingerprintLine -split 'digest:')[1] -replace '[^0-9A-Fa-f]', '').ToLowerInvariant()
          if ($actualFingerprint -ne $env:ANDROID_SIGNING_CERT_SHA256) { throw 'APK signer does not match the configured production keystore.' }
          $badging = & $aapt dump badging $releaseApk 2>&1
          if ($LASTEXITCODE -ne 0) { throw "APK manifest inspection failed: $badging" }
          if ($badging -notmatch "package: name='com.johngraven75.spectragrab'") { throw 'Unexpected Android package ID.' }
          if ($badging -notmatch "versionCode='$env:RELEASE_VERSION_CODE'") { throw 'Unexpected Android version code.' }
          if ($badging -notmatch "versionName='$env:RELEASE_VERSION'") { throw 'Unexpected Android display version.' }
          $signatureReport | Out-File artifacts/release/apk-signature-report.txt -Encoding utf8
          $badging | Out-File artifacts/release/apk-manifest-report.txt -Encoding utf8

      - name: Upload verified production packages
        uses: actions/upload-artifact@v4
        with:
          name: SpectraGrab-Android-production-${{ github.sha }}
          path: artifacts/release/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload runtime verification packages
        uses: actions/upload-artifact@v4
        with:
          name: SpectraGrab-Android-runtime-${{ github.sha }}
          path: artifacts/runtime/**
          if-no-files-found: error
          retention-days: 3

  runtime-smoke:
    name: Android emulator release gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed runtime packages
        uses: actions/download-artifact@v4
        with:
          name: SpectraGrab-Android-runtime-${{ github.sha }}
          path: artifacts/runtime

      - name: Exercise release APK on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-runtime-smoke.sh artifacts/runtime/SpectraGrab-Android-release.apk artifacts/runtime/SpectraGrab-Android-upgrade-test.apk

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpectraGrab-Android-runtime-diagnostics-${{ github.sha }}
          path: artifacts/runtime-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish verified Android release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: runtime-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Download verified production packages
        uses: actions/download-artifact@v4
        with:
          name: SpectraGrab-Android-production-${{ github.sha }}
          path: release

      - name: Publish replacement release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-v${RELEASE_VERSION}"
          notes="Production-signed SpectraGrab Android ${RELEASE_VERSION}. Verified on an Android API 35 x86_64 emulator: launch, direct download, HLS download, completed and user-stopped Live Capture, five persistent add-in configurations, configuration persistence, and a same-key version-code upgrade. Android Build 23 used a debug signing identity; users who installed that test APK must uninstall it once before installing this production line."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/SpectraGrab-Android-v${RELEASE_VERSION}.apk release/SpectraGrab-Android-v${RELEASE_VERSION}.aab --clobber
            gh release edit "$tag" --target "$GITHUB_SHA" --title "SpectraGrab Android v${RELEASE_VERSION}" --notes "$notes" --latest
          else
            gh release create "$tag" release/SpectraGrab-Android-v${RELEASE_VERSION}.apk release/SpectraGrab-Android-v${RELEASE_VERSION}.aab --target "$GITHUB_SHA" --title "SpectraGrab Android v${RELEASE_VERSION}" --notes "$notes" --latest
          fi

      - name: Retire unsigned Build 23 assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old_tag='android-build-23'
          if gh release view "$old_tag" >/dev/null 2>&1; then
            gh release delete-asset "$old_tag" 'com.johngraven75.spectragrab.apk' --yes 2>/dev/null || true
            gh release delete-asset "$old_tag" 'com.johngraven75.spectragrab.aab' --yes 2>/dev/null || true
            gh release edit "$old_tag" --prerelease --title 'SpectraGrab Android Build 23 (superseded test-only)' --notes 'Superseded test build. The unsigned APK/AAB assets were removed. The remaining packages use an Android Debug certificate and are not production releases. Use the latest production-signed SpectraGrab Android release instead.'
          fi

  report-failure:
    name: Report main release failure
    if: always() && github.ref == 'refs/heads/main' && (needs.validate.result == 'failure' || needs.package.result == 'failure' || needs.runtime-smoke.result == 'failure' || needs.release.result == 'failure')
    needs: [validate, package, runtime-smoke, release]
    runs-on: ubuntu-latest
    steps:
      - name: Open release failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Android production release failed — run ${{ github.run_number }}" --body "The production signing, package, emulator, upgrade, or release gate failed. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} Commit: ${{ github.sha }}"
