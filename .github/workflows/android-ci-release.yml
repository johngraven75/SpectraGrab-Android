name: Android CI and Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android

      - name: Restore
        shell: pwsh
        run: dotnet restore SpectraGrab.Android.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build SpectraGrab.Android.csproj -f net10.0-android -c Release --no-restore

      - name: Publish APK
        shell: pwsh
        run: dotnet publish SpectraGrab.Android.csproj -f net10.0-android -c Release --no-restore -p:AndroidPackageFormats=apk -o artifacts/apk

      - name: Publish AAB
        shell: pwsh
        run: dotnet publish SpectraGrab.Android.csproj -f net10.0-android -c Release --no-restore -p:AndroidPackageFormats=aab -o artifacts/aab

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: SpectraGrab-Android-${{ github.sha }}
          path: artifacts/**
          if-no-files-found: error


      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packages = Get-ChildItem artifacts -Recurse -File | Where-Object { $_.Extension -in '.apk', '.aab' }
          if (-not $packages) { throw "No APK or AAB packages were produced." }
          $tag = "android-build-${{ github.run_number }}"
          gh release create $tag @($packages.FullName) --target "${{ github.sha }}" --title "SpectraGrab Android Build ${{ github.run_number }}" --notes "Automated Android release with one-link AI download planning, direct/HLS transfer, adult metadata verification, provider posters, and NFO sidecars."


      - name: Report build failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "⚠️ SpectraGrab Android build failed — run ${{ github.run_number }}" --body "Current-commit Android build or publication failed. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} Commit: ${{ github.sha }}"
